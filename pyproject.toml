[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-flow-analyzer"
version = "0.5.0"
description = "A visual learning tool for classic machine learning workflows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.scripts]
ml-flow-analyzer = "app:main"
